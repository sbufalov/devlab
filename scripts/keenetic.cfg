1. Сетевый правила -> Маршрутизация -> Пользовательские маршруты -> "+ Добавить"
   - до узла -> 192.168.1.98
2. open terminal in web interface
3. Execute commands
   - ip host semantec.lan 192.168.1.98
   - ip host web.semantec.lan 192.168.1.98
   - ip host gitlab.semantec.lan 192.168.1.98
   - ip host gitea.semantec.lan 192.168.1.98
   - ip host mail.semantec.lan 192.168.1.98
4. Restart router
5. Check from cmd.exe
   - ipconfig /flushdns
   - nslookup web.semantec.lan