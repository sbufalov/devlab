# =============================================================================
# DATALAKE STACK - MinIO S3, ClickHouse
# =============================================================================

name: storage

# =============================================================================
# LOGGING TEMPLATE (JSON Driver for Container Logs)
# =============================================================================
x-logging: &json
  driver: "json-file"
  options:
    max-size: "4m"
    max-file: "4"
    labels: "service,component"

services:
  # =============================================================================
  # POSTGRESQL - MLflow Experiment Metadata Backend
  # =============================================================================
  postgres:
    image: postgres:18.4-alpine
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    read_only: true
    logging: *json
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../env/postgres.env
    volumes:
      - /homelab/services/postgres/data:/var/lib/postgresql/data:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    networks:
      - storage
    shm_size: 128m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "otel.metrics.scrape=false"
      - "service.name=postgres"
      - "service.component=storage"

  # =============================================================================
  # MINIO - S3-Compatible Object Storage
  # =============================================================================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    hostname: minio
    restart: unless-stopped
    logging: *json
    command: server /data --console-address ":9001"
    depends_on:
      permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - ../env/minio.env
    volumes:
      - /homelab/services/minio/data:/data:rw
    networks:
      - storage
      - observability
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=9000"
      - "otel.metrics.path=/minio/v2/metrics/cluster"
      - "service.name=minio"
      - "service.component=storage"

  # =============================================================================
  # MINIO INIT - S3 Bucket & Postgres DB Provisioning (Run Once)
  # =============================================================================
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    hostname: minio-init
    restart: "no"
    user: "0:0"   # Required to allow dynamic apk packaging runtime inside alpine
    logging: *json
    env_file:
      - ../env/minio.env
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ./minio/setup.sh:/setup.sh:ro
      - ./minio/policy.json:/policies/semantec.json:ro
    networks:
      - storage
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # =============================================================================
  # CLICKHOUSE - Log Storage Backend
  # =============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.4-alpine
    container_name: clickhouse
    hostname: clickhouse
    restart: unless-stopped
    logging: *json
    depends_on:
      permissions:
        condition: service_completed_successfully
    env_file:
      - ../env/clickhouse.env
    volumes:
      - ./clickhouse/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - /homelab/observability/clickhouse/data:/var/lib/clickhouse:rw
    networks:
      - storage
      - observability
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=9363"
      - "otel.metrics.path=/metrics"
      - "service.name=clickhouse"
      - "service.component=storage"

  # =============================================================================
  # VICTORIAMETRICS - Metrics (Time Series) Storage Backend
  # =============================================================================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.143.0
    container_name: victoriametrics
    hostname: victoriametrics
    restart: unless-stopped
    logging: *json
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--retentionPeriod=14d'
      - '--httpListenAddr=:8428'
    depends_on:
      permissions:
        condition: service_completed_successfully
    volumes:
      - /homelab/observability/victoriametrics/data:/victoria-metrics-data:rw
    networks:
      - storage
      - observability
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=8428"
      - "otel.metrics.path=/metrics"
      - "service.name=victoriametrics"
      - "service.component=storage"
