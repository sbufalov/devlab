upstream php_fpm_backend {
    server webmail:9000;
}

server {
    listen 80;
    server_name _;
    
    root /var/www/html;
    index index.php index.html;

    # INCREASE THIS: To allow sending attachments (e.g., 50MB)
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }

    location ~* ^/(bin|config|logs|temp|vendor)/ {
        deny all;
    }

    location ~* ^/(plugins|skins)/.*\.(php|sh)$ {
        deny all;
    }

    location ~ ^/(.+\.php)(.*)$ {
        fastcgi_pass php_fpm_backend;
        include fastcgi_params;
        
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeouts for large attachments
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # --- SSL READINESS ---
        # This tells Roundcube that the connection is actually HTTPS
        # even though Caddy is talking to Nginx over HTTP (port 80)
        fastcgi_param HTTPS $http_x_forwarded_proto;
        # Standard proxy headers
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 14d;
        add_header Cache-Control "public, immutable";
    }
}
