# =============================================================================
# VICTORIAMETRICS ALERT RULES
# =============================================================================

groups:
  # ---------------------------------------------------------------------------
  # Infrastructure Alerts
  # ---------------------------------------------------------------------------
  - name: infrastructure
    interval: 30s
    rules:
      # Host is down
      - alert: HostDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Host {{ $labels.instance }} is down"
          description: "Node exporter on {{ $labels.instance }} has been down for more than 1 minute."

      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% (current: {{ $value }}%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% (current: {{ $value }}%)"

      # Critical memory usage
      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "CRITICAL memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 95% (current: {{ $value }}%)"

  # ---------------------------------------------------------------------------
  # Storage Alerts
  # ---------------------------------------------------------------------------
  - name: storage
    interval: 60s
    rules:
      # Low disk space
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/homelab"} / node_filesystem_size_bytes{mountpoint="/homelab"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 20% (current: {{ $value }}%)"

      # Critical disk space
      - alert: CriticalDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/homelab"} / node_filesystem_size_bytes{mountpoint="/homelab"}) * 100 < 10
        for: 2m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "CRITICAL disk space on {{ $labels.instance }}"
          description: "Disk space is below 10% (current: {{ $value }}%)"

      # ClickHouse is down
      - alert: ClickHouseDown
        expr: up{service="clickhouse"} == 0
        for: 1m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "ClickHouse is down"
          description: "ClickHouse database has been unreachable for 1 minute."

      # VictoriaMetrics is down
      - alert: VictoriaMetricsDown
        expr: up{service="victoriametrics"} == 0
        for: 1m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "VictoriaMetrics is down"
          description: "VictoriaMetrics has been unreachable for 1 minute."

      # MinIO is down
      - alert: MinIODown
        expr: up{service="minio"} == 0
        for: 2m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "MinIO object storage is down"
          description: "MinIO S3 storage has been unreachable for 2 minutes."

  # ---------------------------------------------------------------------------
  # Container Alerts
  # ---------------------------------------------------------------------------
  - name: containers
    interval: 30s
    rules:
      # Container high memory
      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Container {{ $labels.container }} high memory usage"
          description: "Container memory usage is above 90% of limit (current: {{ $value }}%)"

      # Container restarting
      - alert: ContainerRestarting
        expr: rate(container_restart_count[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Container {{ $labels.container }} is restarting"
          description: "Container has restarted {{ $value }} times in the last 15 minutes."

  # ---------------------------------------------------------------------------
  # AMD GPU Alerts
  # ---------------------------------------------------------------------------
  - name: gpu
    interval: 60s
    rules:
      # GPU high temperature
      - alert: GPUHighTemperature
        expr: amd_gpu_temperature_celsius > 85
        for: 5m
        labels:
          severity: warning
          component: hardware
        annotations:
          summary: "AMD GPU {{ $labels.gpu }} high temperature"
          description: "GPU temperature is above 85°C (current: {{ $value }}°C)"

      # GPU critical temperature
      - alert: GPUCriticalTemperature
        expr: amd_gpu_temperature_celsius > 95
        for: 2m
        labels:
          severity: critical
          component: hardware
        annotations:
          summary: "AMD GPU {{ $labels.gpu }} CRITICAL temperature"
          description: "GPU temperature is above 95°C (current: {{ $value }}°C)"

      # GPU memory usage
      - alert: GPUHighMemoryUsage
        expr: (amd_gpu_memory_used_bytes / amd_gpu_memory_total_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
          component: hardware
        annotations:
          summary: "AMD GPU {{ $labels.gpu }} high memory usage"
          description: "GPU memory usage is above 90% (current: {{ $value }}%)"

  # ---------------------------------------------------------------------------
  # Observability Stack Alerts
  # ---------------------------------------------------------------------------
  - name: observability
    interval: 60s
    rules:
      # Grafana is down
      - alert: GrafanaDown
        expr: up{service="grafana"} == 0
        for: 2m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "Grafana is down"
          description: "Grafana dashboard has been unreachable for 2 minutes."

      # Jaeger is down
      - alert: JaegerDown
        expr: up{service="jaeger"} == 0
        for: 2m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "Jaeger is down"
          description: "Jaeger tracing service has been unreachable for 2 minutes."

      # OTEL Collector is down
      - alert: OTELCollectorDown
        expr: up{service="otel-collector"} == 0
        for: 1m
        labels:
          severity: critical
          component: observability
        annotations:
          summary: "OTEL Collector is down"
          description: "OpenTelemetry Collector has been unreachable for 1 minute. Telemetry data loss is occurring."

      # qryn is down
      - alert: QrynDown
        expr: up{service="qryn"} == 0
        for: 2m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "qryn log aggregation is down"
          description: "qryn has been unreachable for 2 minutes. Log ingestion may be affected."

  # ---------------------------------------------------------------------------
  # ML/AI Alerts
  # ---------------------------------------------------------------------------
  - name: ml
    interval: 60s
    rules:
      # MLflow is down
      - alert: MLflowDown
        expr: up{service="mlflow"} == 0
        for: 5m
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "MLflow is down"
          description: "MLflow experiment tracking has been unreachable for 5 minutes."

      # Pyroscope is down
      - alert: PyroscopeDown
        expr: up{service="pyroscope"} == 0
        for: 5m
        labels:
          severity: warning
          component: profiling
        annotations:
          summary: "Pyroscope profiling is down"
          description: "Pyroscope continuous profiling has been unreachable for 5 minutes."
