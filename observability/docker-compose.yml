# =============================================================================
# OBSERVABILITY STACK (OTEL-Based with Auto-Discovery)
# =============================================================================

name: observability

# =============================================================================
# LOGGING TEMPLATE (JSON Driver for Container Logs)
# =============================================================================
x-logging: &json
  driver: "json-file"
  options:
    max-size: "4m"
    max-file: "4"
    labels: "service,component"

services:
  # =============================================================================
  # PERMISSIONS - Run this first to fix permissions
  # =============================================================================
  permissions:
    extends:
      file: ../docker-compose.yml
      service: permissions

  # =============================================================================
  # OPEN-TELEMETRY COLLECTOR - Primary Telemetry Entrypoint
  # =============================================================================
  otel:
    image: otel/opentelemetry-collector-contrib:0.152.1
    container_name: otel
    hostname: otel
    restart: unless-stopped
    logging: *json
    user: "0:0"
    command: ["--config=/etc/otel-collector-config.yaml"]
    depends_on:
      victoriametrics:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    volumes:
      - ./opentelemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - infra
      - frontend
      - observability
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13133/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=8888"
      - "otel.metrics.path=/metrics"
      - "service.name=otel"
      - "service.component=collection"

  # =============================================================================
  # JAEGER - Distributed Tracing
  # =============================================================================
  jaeger:
    image: jaegertracing/jaeger:2.17.0
    container_name: jaeger
    hostname: jaeger
    restart: unless-stopped
    logging: *json
    depends_on:
      permissions:
        condition: service_completed_successfully
    env_file:
      - ../env/jaeger.env
    volumes:
      - ./jaeger/sampling.json:/etc/jaeger/sampling.json:ro
      - /homelab/observability/jaeger/badger:/badger:rw
    networks:
      - frontend
      - observability
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=14269"
      - "otel.metrics.path=/metrics"
      - "service.name=jaeger"
      - "service.component=tracing"

  # =============================================================================
  # PYROSCOPE - Continuous Profiling (S3-Backed v2 Architecture)
  # =============================================================================
  pyroscope:
    image: grafana/pyroscope:2.0.2
    container_name: pyroscope
    hostname: pyroscope
    restart: unless-stopped
    logging: *json
    user: "10001:10001"
    command:
      - "server"
      - "--config=/etc/pyroscope/config.yml"
    env_file:
      - ../env/minio.env
    depends_on:
      permissions:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./pyroscope/config.yml:/etc/pyroscope/config.yml:ro
      - /homelab/observability/pyroscope/data:/var/lib/pyroscope:rw
    networks:
      - frontend
      - observability
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4040/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=4040"
      - "otel.metrics.path=/metrics"
      - "service.name=pyroscope"
      - "service.component=profiling"

  # =============================================================================
  # NODE EXPORTER - Host Metrics
  # =============================================================================
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    logging: *json
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile-collector'
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.diskstats'
      - '--collector.filesystem'
      - '--collector.loadavg'
      - '--collector.uname'
      - '--collector.netdev'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./node-exporter:/textfile-collector:ro
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=9100"
      - "otel.metrics.path=/metrics"
      - "service.name=node-exporter"
      - "service.component=exporters"

  # =============================================================================
  # CADVISOR - Container Metrics
  # =============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped
    logging: *json
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=disk,diskIO,network,tcp,udp,percpu,sched,process'
      - '--store_container_labels=false'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      - observability
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=8080"
      - "otel.metrics.path=/metrics"
      - "service.name=cadvisor"
      - "service.component=exporters"

  # =============================================================================
  # ROCM EXPORTER - AMD GPU Metrics
  # =============================================================================
  rocm-exporter:
    image: rocm/device-metrics-exporter:v1.5.0
    container_name: rocm-exporter
    hostname: rocm-exporter
    restart: unless-stopped
    logging: *json
    privileged: true
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    cap_add:
      - SYS_MODULE
    security_opt:
      - apparmor:unconfined
    networks:
      - observability
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=9105"
      - "otel.metrics.path=/metrics"
      - "service.name=rocm-exporter"
      - "service.component=exporters"

  # =============================================================================
  # BLACKBOX EXPORTER - Endpoint Probing (HTTP, TCP, ICMP, DNS)
  # =============================================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox
    hostname: blackbox
    restart: unless-stopped
    logging: *json
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - observability
      - frontend
      - infra
      - backend
      - mail
      - storage
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9115/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=9115"
      - "otel.metrics.path=/metrics"
      - "service.name=blackbox"
      - "service.component=exporters"

  # =============================================================================
  # QRYN - Loki-Compatible Log Aggregation (ClickHouse Frontend)
  # =============================================================================
  qryn:
    image: ghcr.io/metrico/qryn:3.2.39
    container_name: qryn
    hostname: qryn
    restart: unless-stopped
    logging: *json
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_SERVER=clickhouse
      - CLICKHOUSE_PORT=8123
      - NODE_ENV=production
      - QRYN_CONFIG=/config/config.json
    volumes:
      - ./qryn/config.json:/config/config.json:ro
    networks:
      - storage
      - frontend
      - observability
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3100/ready', (r) => {if (r.statusCode !== 200) process.exit(1); process.exit(0);}).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "otel.metrics.scrape=false"
      - "service.name=qryn"
      - "service.component=logs"

  # =============================================================================
  # ALERTMANAGER - Alert Routing
  # =============================================================================
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    hostname: alertmanager
    restart: unless-stopped
    logging: *json
    user: "nobody"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alertmanager.semantec.lan'
      - '--cluster.advertise-address=0.0.0.0:9093'
    depends_on:
      permissions:
        condition: service_completed_successfully
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /homelab/observability/alertmanager/data:/alertmanager:rw
    networks:
      - frontend
      - observability
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "otel.metrics.scrape=true"
      - "otel.metrics.port=9093"
      - "otel.metrics.path=/metrics"
      - "service.name=alertmanager"
      - "service.component=alerting"

  # =============================================================================
  # GRAFANA - Visualization Platform
  # =============================================================================
  grafana:
    image: grafana/grafana:11.5.3
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    logging: *json
    user: "472:472"
    depends_on:
      permissions:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_healthy
      qryn:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      pyroscope:
        condition: service_started
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Semantec1973
      - GF_SERVER_ROOT_URL=https://grafana.semantec.lan
      - GF_SERVER_DOMAIN=grafana.semantec.lan
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor,metricsSummary
      - GF_PLUGINS_PREINSTALL=grafana-clickhouse-datasource
      - GF_ALERTING_ENABLED=false                # If alerts are not used inside Grafana itself
      - GF_UNIFIED_ALERTING_ENABLED=false        # Disable background rule checking scheduler
    volumes:
      - /homelab/observability/grafana/data:/var/lib/grafana:rw
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - frontend
      - observability
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "otel.metrics.scrape=false"
      - "service.name=grafana"
      - "service.component=visualization"
